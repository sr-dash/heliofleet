# Monthly refresh of the site's data.
#
# Ephemerides: refetches every year from the previous one onward, so predicted
# trajectories are replaced as missions publish fitted ones, and appends new
# years when a spacecraft's Horizons ephemeris is extended. The manifest
# records when this ran and when it runs next; the page shows both.
# Events: merges the last 150 days of DONKI flares, CMEs and storms.
# Calendar: rebuilds calendar.ics and data/upcoming.json from the new data.
# Synoptic maps: adds new HMI Carrington rotation maps and the daily frame.
# Ground: refreshes the DKIST Cryo-NIRSP footprints from the Cryo-NIRSP viewer.

name: Update ephemeris

on:
  schedule:
    # 06:17 UTC on the 1st of each month. Keep in step with SCHEDULE_* in
    # scripts/fetch_ephemeris.py, which computes the next-update stamp.
    - cron: "17 6 1 * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Rebuild every year from 2010 instead of the incremental refresh"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  issues: write

concurrency:
  group: update-ephemeris
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch ephemerides from JPL Horizons
        run: |
          if [ "${{ inputs.full }}" = "true" ]; then
            python scripts/fetch_ephemeris.py
          else
            python scripts/fetch_ephemeris.py --incremental
          fi

      - name: Fetch space-weather events from DONKI
        run: |
          if [ "${{ inputs.full }}" = "true" ]; then
            python scripts/fetch_events.py
          else
            python scripts/fetch_events.py --incremental
          fi

      - name: Fetch SDO/HMI synoptic magnetograms
        run: python scripts/fetch_synoptic.py

      - name: Fetch DKIST Cryo-NIRSP footprints
        run: python scripts/fetch_ground.py

      # Images for new Cryo-NIRSP runs; a Helioviewer outage only leaves gaps
      - name: Fetch SDO context images for Cryo-NIRSP
        id: context
        continue-on-error: true
        run: |
          pip install --quiet pillow numpy
          python scripts/fetch_context.py

      # IRIS, Hinode/EIS, DKIST and Solar Orbiter footprints of the last twelve months
      - name: Fetch observation footprints
        id: observations
        continue-on-error: true
        run: python scripts/fetch_observations.py

      - name: Build the calendar of upcoming events
        run: python scripts/build_calendar.py

      # Nothing is committed unless the new data pass both checks.
      - name: Check the new data
        run: python scripts/check_data.py

      - name: Check the geometry against Horizons and SunPy
        run: node tests/validate.mjs

      - name: Commit and push
        id: commit
        run: |
          git config user.name "Soumyaranjan Dash"
          git config user.email "sdash@nso.edu"
          git add data README.md sitemap.xml calendar.ics
          if git diff --cached --quiet; then
            echo "No changes."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          end=$(python -c "import json,datetime as d; m=json.load(open('data/manifest.json')); print(d.datetime.fromtimestamp((m['timeline']['end']-2440587.5)*86400, d.timezone.utc).date())")
          git commit -m "Update ephemeris data for $(date -u +%Y-%m)" \
                     -m "Monthly refresh from JPL Horizons and DONKI. Timeline now ends ${end}."
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with the workflow token do not always start a Pages build,
      # so request one explicitly.
      - name: Rebuild the site
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/pages/builds" --silent \
            || echo "::warning::Could not request a Pages build; it will publish on the next push."

      # A failed image or footprint fetch does not stop the update, but is reported
      - name: Report a partial update
        if: steps.context.outcome == 'failure' || steps.observations.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/report_failure.sh "Monthly update could not fetch some observation data"

      - name: Report a failed update
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/report_failure.sh "Monthly data update failed"
